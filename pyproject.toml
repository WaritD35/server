[project]
name = "pet-plant-server"
version = "0.1.0"
description = "Cloud backend for Pet-Plant: VLM-based plant-health assessment with a character-mediated interface"
requires-python = ">=3.12"

# Fixed baseline. Each bounded context adds the libraries it needs on top
# (a segmentation client, etc.) — those are not pinned here. The AI stack is the
# exception: it is pinned below because it lives once, in `src/mlops`, and every
# LLM-using context calls into that rather than holding a client of its own.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "email-validator>=2.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "minio>=7.2",
    "pyjwt>=2.9",
    "python-multipart>=0.0.12",
    "langfuse>=4.15.1",
    "langchain>=1.4.0",
    "langchain-openai>=1.6.0",
    "pgvector>=0.3.0",
    "langchain-ollama>=1.1.0",
    "opencv-python-headless>=4.10",
    "numpy>=2.0",
    "jsonschema>=4.26.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
]
# In-process VLM (`VLM_PROVIDER=local`). Not a default group, so neither
# `uv sync` nor the Docker image installs it: `uv sync --group vlm-local`.
vlm-local = [
    "torch>=2.4",
    "torchvision>=0.19",
    "transformers>=4.56",
    "accelerate>=1.0",
    "pillow>=10.4",
    "safetensors>=0.4",
    "timm>=1.0",
    "einops>=0.8",
]

[tool.uv]
# This is an application, not a distributable package: uv only manages the
# virtualenv and the lockfile. Entrypoints are run with `--app-dir src`.
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = [
    "api",
    "core",
    "orchestrator",
    "registry",
    "capture",
    "knowledge",
    "assessment",
    "advice",
    "companion",
    "action",
    "mlops",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = ["src", "tests"]
ignore_missing_imports = true
# tests/ carries no __init__.py (so `tests/<ctx>` never shadows `src/<ctx>`);
# this lets mypy tell the per-context conftest.py files apart all the same.
explicit_package_bases = true
namespace_packages = true
