name: pet-plant

# One command from the repo root brings up the whole local stack — PostgreSQL,
# MinIO (+ buckets) and the FastAPI web service:
#
#   docker compose up --build
#
# Run a worker job ad hoc:
#   docker compose run --rm worker python src/main_worker.py <job>
#
# Self-hosted inference (VLM served with vLLM, segmentation) runs on separate
# infrastructure and is NOT part of this file — point VLM_API_BASE /
# SEGMENTATION_ENDPOINT at it via .env.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: petplant
      POSTGRES_PASSWORD: petplant
      POSTGRES_DB: petplant
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petplant -d petplant"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - minio-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/captures local/frames-derived local/exemplars local/eval-sets
      "

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://petplant:petplant@postgres:5432/petplant
      MINIO_ENDPOINT: minio:9000
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: "no"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://petplant:petplant@postgres:5432/petplant
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    profiles: ["tools"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://petplant:petplant@postgres:5432/petplant
      MINIO_ENDPOINT: minio:9000
    command: ["python", "src/main_worker.py"]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:
